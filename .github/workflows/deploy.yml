name: Build real-analysis and deploy to sdykim.me

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-analysis-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run check-deps

      - run: npm run build

      - name: Verify prerender outputs
        run: |
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/ko/index.html
          test -f dist/en/index.html
          test -f dist/ko/series/index.html
          test -f dist/en/series/index.html
          test -f dist/ko/series/harmonic/index.html
          test -f dist/en/series/grandi/index.html

      - run: npm run size

      - name: Check out the Pages site repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: lazybuttrying/lazybuttrying.github.io
          ref: master
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages-site

      - name: Sync built site into the Pages repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rsync -a --delete dist/ pages-site/lecture/real-analysis/

      - name: Commit and push the Pages repo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd pages-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lecture/real-analysis
          if git diff --cached --quiet; then
            echo "No site changes to deploy."
          else
            git commit -m "Deploy real-analysis from lazybuttrying/real-analysis@${GITHUB_SHA::7}"
            git push
          fi
